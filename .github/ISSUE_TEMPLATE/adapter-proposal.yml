name: P2P adapter proposal
description: Propose interoperability with a peer-to-peer conversational messaging protocol.
title: "[adapter] "
labels: ["adapter"]
body:
  - type: input
    id: protocol
    attributes:
      label: P2P protocol or messaging stack
      description: Name and authoritative URL for the protocol, stack, SDK, or implementation.
    validations:
      required: true

  - type: textarea
    id: architecture
    attributes:
      label: Native P2P architecture
      description: Describe peer identity, addressing, discovery, bootstrap, connection or session lifecycle, NAT traversal, relays, runtime, and supported platforms where relevant.
    validations:
      required: true

  - type: textarea
    id: capabilities
    attributes:
      label: Idalion capabilities
      description: Which inbound and outbound conversational capabilities can this adapter implement honestly, and with which constraints?
    validations:
      required: true

  - type: textarea
    id: asymmetry
    attributes:
      label: Asymmetry and semantic differences
      description: Describe directional limitations, unsupported operations, native semantic differences, and any lossy mappings that must not be hidden.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security boundary
      description: Describe peer authentication, transport security, E2EE where applicable, key ownership, bootstrap or relay trust, metadata exposure, persistence, and security properties changed at the protocol boundary.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Implementation and dependencies
      description: Describe the proposed implementation, native protocol dependencies, runtime requirements, and why they belong inside the adapter.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal targets a P2P conversational messaging protocol rather than a centralized, service-controlled, or federated messaging platform.
          required: true